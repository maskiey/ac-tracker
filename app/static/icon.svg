<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AC Tracker">
  <defs>
    <linearGradient id="ac-face" x1="18%" y1="12%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="ac-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="ac-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ac-drop" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/>
      <feOffset dx="0" dy="2" in="b" result="o"/>
      <feComponentTransfer in="o" result="a">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="a"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 圆角图标：蓝紫渐变 + 细边 + 高光 -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#ac-face)" filter="url(#ac-drop)"/>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="none" stroke="url(#ac-rim)" stroke-width="1.25"/>
  <rect x="10" y="10" width="108" height="56" rx="26" fill="url(#ac-shine)"/>
  <!-- 迷你热力格 -->
  <g fill="#f8fafc" opacity="0.9">
    <rect x="28" y="80" width="9" height="9" rx="2" opacity="0.38"/>
    <rect x="41" y="80" width="9" height="9" rx="2" opacity="0.58"/>
    <rect x="54" y="80" width="9" height="9" rx="2" opacity="0.45"/>
    <rect x="28" y="93" width="9" height="9" rx="2" opacity="0.52"/>
    <rect x="41" y="93" width="9" height="9" rx="2" opacity="0.78"/>
    <rect x="54" y="93" width="9" height="9" rx="2" opacity="0.62"/>
  </g>
  <!-- AC 对勾 -->
  <path
    d="M36 50 L58 72 L92 38"
    fill="none"
    stroke="#f8fafc"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M36 50 L58 72 L92 38"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.35"
  />
</svg>
