<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AC Tracker">
  <defs>
    <linearGradient id="ac-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ac-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ac-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/>
      <feOffset dx="0" dy="1" in="b" result="o"/>
      <feComponentTransfer in="o" result="a">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="a"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 圆角底板 + 轻微光泽 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#ac-bg)" filter="url(#ac-soft)"/>
  <rect x="8" y="8" width="112" height="64" rx="28" fill="url(#ac-shine)"/>
  <!-- 热力图式小格（呼应「轨迹」） -->
  <g opacity="0.92" fill="#ffffff">
    <rect x="26" y="78" width="10" height="10" rx="2.5" opacity="0.35"/>
    <rect x="40" y="78" width="10" height="10" rx="2.5" opacity="0.55"/>
    <rect x="54" y="78" width="10" height="10" rx="2.5" opacity="0.42"/>
    <rect x="26" y="92" width="10" height="10" rx="2.5" opacity="0.5"/>
    <rect x="40" y="92" width="10" height="10" rx="2.5" opacity="0.72"/>
    <rect x="54" y="92" width="10" height="10" rx="2.5" opacity="0.6"/>
  </g>
  <!-- AC / 完成：对勾 -->
  <path
    d="M34 52 L56 74 L94 36"
    fill="none"
    stroke="#f8fafc"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
