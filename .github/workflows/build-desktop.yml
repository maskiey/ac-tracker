# 在 GitHub Actions 中构建 macOS（.zip + .dmg）与 Windows（便携 zip + Inno Setup）
name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "run_desktop.py"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/build-desktop.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Verify imports
        run: python -c "import webview; import run_desktop; import app.main"

      - name: PyInstaller (macOS)
        run: python -m PyInstaller packaging/acm_tracker.spec --noconfirm --clean

      - name: List dist (debug)
        if: success() || failure()
        run: |
          ls -la dist || true
          ls -la "dist/AC Tracker.app" 2>/dev/null || true

      - name: Create DMG
        run: bash packaging/build_dmg.sh

      - name: Zip artifacts
        run: |
          cd dist
          zip -ry ../AC-Tracker-macos-app.zip "AC Tracker.app"
          zip -ry ../AC-Tracker-macos-folder.zip AC-Tracker

      - uses: actions/upload-artifact@v6
        with:
          name: acm-tracker-macos
          path: |
            AC-Tracker-macos.dmg
            AC-Tracker-macos-app.zip
            AC-Tracker-macos-folder.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Verify imports
        run: python -c "import webview; import run_desktop; import app.main"

      - name: Generate app.ico (from app/static/icon.png)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pip install pillow
          python packaging/generate_icons.py

      - name: PyInstaller (Windows)
        run: python -m PyInstaller packaging/acm_tracker.spec --noconfirm --clean

      - name: List dist (debug)
        if: success() || failure()
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem -Path dist -Recurse -Depth 3 | ForEach-Object { $_.FullName } }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          $raw = Get-Content -Path app/version.py -Raw
          if (-not ($raw -match 'APP_VERSION\s*=\s*"([^"]+)"')) {
            throw "Could not parse APP_VERSION from app/version.py"
          }
          $ver = $Matches[1]
          & $iscc /DMyAppVersion=$ver packaging\AC-Tracker.iss
          if (-not (Test-Path "AC-Tracker-Windows-Setup.exe")) { throw "AC-Tracker-Windows-Setup.exe missing" }

      - name: Zip portable folder
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AC-Tracker\AC-Tracker.exe")) { throw "dist\AC-Tracker\AC-Tracker.exe missing" }
          Compress-Archive -Path "dist\AC-Tracker" -DestinationPath "AC-Tracker-windows-portable.zip" -Force

      - uses: actions/upload-artifact@v6
        with:
          name: acm-tracker-windows
          path: |
            AC-Tracker-windows-portable.zip
            AC-Tracker-Windows-Setup.exe
          if-no-files-found: error
