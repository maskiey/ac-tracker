# 推送 v* 标签时构建 macOS / Windows 安装包并上传到 GitHub Releases
name: Release desktop packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Verify imports
        run: python -c "import webview; import run_desktop; import app.main"

      - name: PyInstaller (macOS)
        run: python -m PyInstaller packaging/acm_tracker.spec --noconfirm --clean

      - name: List dist (debug)
        if: success() || failure()
        run: |
          ls -la dist || true
          ls -la "dist/AC Tracker.app" 2>/dev/null || true

      - name: Zip artifacts
        run: |
          cd dist
          zip -ry ../AC-Tracker-macos-app.zip "AC Tracker.app"
          zip -ry ../AC-Tracker-macos-folder.zip AC-Tracker

      - uses: actions/upload-artifact@v6
        with:
          name: acm-tracker-macos
          path: |
            AC-Tracker-macos-app.zip
            AC-Tracker-macos-folder.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Verify imports
        run: python -c "import webview; import run_desktop; import app.main"

      - name: PyInstaller (Windows)
        run: python -m PyInstaller packaging/acm_tracker.spec --noconfirm --clean

      - name: List dist (debug)
        if: success() || failure()
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem -Path dist -Recurse -Depth 3 | ForEach-Object { $_.FullName } }

      - name: Zip folder
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AC-Tracker\AC-Tracker.exe")) { throw "dist\AC-Tracker\AC-Tracker.exe missing" }
          Compress-Archive -Path "dist\AC-Tracker" -DestinationPath "AC-Tracker-windows.zip" -Force

      - uses: actions/upload-artifact@v6
        with:
          name: acm-tracker-windows
          path: AC-Tracker-windows.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v6
        with:
          name: acm-tracker-macos
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: acm-tracker-windows
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AC Tracker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/macos/AC-Tracker-macos-app.zip
            artifacts/macos/AC-Tracker-macos-folder.zip
            artifacts/windows/AC-Tracker-windows.zip
